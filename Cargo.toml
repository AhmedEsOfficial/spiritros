[workspace]
resolver = "2"
members = [
    "kernel",
    "runtime/shell",
    "runtime/spiritfs",
    "runtime/inference",
    "runtime/memory",
    "runtime/scheduler",
    "runtime/compat",
    "runtime/security",
    "runtime/networking",
    "sdk/rust",
    "benchmarks",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
repository = "https://github.com/spiritros/spiritros"
description = "SpiritROS — The First LLM-Native Operating System"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.43", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
rkyv = { version = "0.8", features = ["validation"] }
bincode = "1.3"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# gRPC / networking
tonic = "0.12"
prost = "0.13"
tower = "0.5"
hyper = { version = "1.5", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# System interfaces
nix = { version = "0.29", features = ["fs", "process", "signal", "mount", "sched"] }
libc = "0.2"

# FUSE (requires libfuse3-dev to compile)
fuser = "0.15"

# Metrics
prometheus-client = "0.23"

# UUID
uuid = { version = "1.11", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Config
figment = { version = "0.10", features = ["yaml", "env", "toml"] }

# Testing
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.bench]
inherits = "release"
debug = true
