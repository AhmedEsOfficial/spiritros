# =============================================================================
# SpiritROS Phase 1 — Prometheus Scrape Configuration
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

  external_labels:
    cluster: "spiritros-phase1"
    environment: "development"

# =============================================================================
# Scrape Targets
# =============================================================================
scrape_configs:
  # SpiritROS metrics (inference coordinator, memory zones, scheduler)
  - job_name: "spiritros"
    static_configs:
      - targets: ["spiritros:9090"]
        labels:
          service: "spiritros-core"
    metrics_path: "/metrics"
    scrape_interval: 10s

  # Ollama inference backend
  - job_name: "ollama"
    static_configs:
      - targets: ["spiritros:11434"]
        labels:
          service: "ollama"
    metrics_path: "/api/metrics"
    scrape_interval: 10s

  # SpiritFS semantic filesystem
  - job_name: "spiritfs"
    static_configs:
      - targets: ["spiritros:9104"]
        labels:
          service: "spiritfs"
    metrics_path: "/metrics"
    scrape_interval: 15s

  # Qdrant vector database
  - job_name: "qdrant"
    static_configs:
      - targets: ["qdrant:6333"]
        labels:
          service: "qdrant"
    metrics_path: "/metrics"
    scrape_interval: 30s

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
